<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evidence MTH – vozíky a baterie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#00243D; --navy2:#0B3A5C; --blue:#42B0D5; --blue-d:#2A8FB3; --blue-l:#E6F5FA;
  --bg:#F4F6F8; --card:#fff; --line:#E1E6EB; --text:#1B2A36; --muted:#5F6F7C;
  --ok:#1E8E5A; --ok-l:#E3F4EC; --warn:#B7791F; --warn-l:#FDF3E1; --bad:#C2372F; --bad-l:#FBE7E5;
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Source Sans 3",system-ui,sans-serif;font-size:15px;line-height:1.45}
a{color:var(--blue-d)}
button{font:inherit;cursor:pointer}
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.top .in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:28px;padding:0 24px;height:64px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px;letter-spacing:.2px;cursor:pointer;white-space:nowrap}
.brand .mark{width:34px;height:34px;border-radius:6px;background:var(--blue);display:grid;place-items:center}
.brand small{display:block;font-weight:400;font-size:12px;color:#9CC3D6;margin-top:-3px}
nav{display:flex;gap:4px;height:100%}
nav a{color:#CFE3EE;text-decoration:none;display:flex;align-items:center;padding:0 14px;border-bottom:3px solid transparent;font-weight:500}
nav a:hover{color:#fff}
nav a.on{color:#fff;border-bottom-color:var(--blue)}
.top .sp{flex:1}
.sync{font-size:12px;color:#9CC3D6;white-space:nowrap}
main{max-width:1240px;margin:0 auto;padding:28px 24px 64px}
h1{font-size:28px;margin:0 0 4px;color:var(--navy);font-weight:700}
h2{font-size:19px;margin:0 0 14px;color:var(--navy)}
.sub{color:var(--muted);margin:0 0 22px}
.btn{border:1px solid var(--blue-d);background:var(--blue);color:#fff;padding:9px 16px;border-radius:var(--r);font-weight:600;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--blue-d)}
.btn.sec{background:#fff;color:var(--navy);border-color:#BFCBD4}
.btn.sec:hover{background:var(--blue-l)}
.btn.dark{background:var(--navy);border-color:var(--navy)}
.btn.dark:hover{background:var(--navy2)}
.btn.danger{background:#fff;color:var(--bad);border-color:#E3B4B0}
.btn.danger:hover{background:var(--bad-l)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.hero{background:linear-gradient(120deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;border-radius:var(--r);padding:36px 36px 32px;position:relative;overflow:hidden}
.hero h1{color:#fff;font-size:32px}
.hero p{color:#C9DDE8;max-width:720px;margin:8px 0 0;font-size:16px}
.hero svg.deco{position:absolute;right:-20px;bottom:-30px;opacity:.13}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin:22px 0}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px;cursor:pointer;display:flex;gap:20px;align-items:center;transition:.15s;border-left:5px solid var(--blue)}
.tile:hover{box-shadow:0 6px 20px rgba(0,36,61,.10);transform:translateY(-1px)}
.tile .ic{width:64px;height:64px;border-radius:50%;background:var(--blue-l);display:grid;place-items:center;flex:none}
.tile h3{margin:0;font-size:21px;color:var(--navy)}
.tile p{margin:4px 0 0;color:var(--muted)}
.tile .num{margin-left:auto;font-size:40px;font-weight:700;color:var(--navy);line-height:1}
.tile .num small{display:block;font-size:12px;font-weight:500;color:var(--muted);text-align:right}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.stat b{display:block;font-size:26px;color:var(--navy)}
.stat span{color:var(--muted);font-size:13px}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)} .stat.ok b{color:var(--ok)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar input,.bar select{padding:9px 12px;border:1px solid #C7D1D9;border-radius:var(--r);font:inherit;background:#fff}
.bar input{min-width:260px}
.bar .sp{flex:1}
table.list{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
table.list th{background:#EEF2F5;color:var(--navy);text-align:left;font-weight:600;font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:#F5FAFC}
table.list tr:last-child td{border-bottom:0}
.thumb{width:52px;height:40px;border-radius:4px;object-fit:cover;background:#E8EDF1;display:block}
.thumb.ph{display:grid;place-items:center;color:#9AAAB6}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-l);color:var(--ok)} .b-warn{background:var(--warn-l);color:var(--warn)} .b-bad{background:var(--bad-l);color:var(--bad)} .b-mut{background:#EEF2F5;color:var(--muted)} .b-blue{background:var(--blue-l);color:var(--blue-d)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;color:var(--navy)}
.empty{padding:40px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #C7D1D9;border-radius:var(--r)}
.crumb{color:var(--muted);font-size:14px;margin-bottom:10px}
.crumb a{text-decoration:none}
.det{display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:start}
.photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r);background:#E8EDF1;display:grid;place-items:center;color:#9AAAB6;border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 20px}
.kv div span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.kv div b{font-weight:600}
.headrow{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.headrow .sp{flex:1}
.sect{margin-top:20px}
.alerts td{padding:9px 12px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,26,44,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:#fff;border-radius:8px;width:100%;max-width:820px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.sm{max-width:480px}
.modal header{background:var(--navy);color:#fff;padding:16px 22px;border-radius:8px 8px 0 0;display:flex;align-items:center}
.modal header h3{margin:0;font-size:18px;flex:1}
.modal header button{background:none;border:0;color:#fff;font-size:24px;line-height:1}
.modal .body{padding:22px}
.modal footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 16px}
.grid .full{grid-column:1/-1} .grid .two{grid-column:span 2}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
label.f input,label.f select,label.f textarea{font:inherit;color:var(--text);padding:8px 10px;border:1px solid #C7D1D9;border-radius:var(--r);background:#fff}
label.f input:focus,label.f select:focus,label.f textarea:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.fs{grid-column:1/-1;font-weight:700;color:var(--navy);border-bottom:2px solid var(--blue);padding-bottom:4px;margin-top:6px;font-size:14px;text-transform:uppercase;letter-spacing:.5px}
.photoedit{display:flex;gap:14px;align-items:center}
.photoedit img,.photoedit .ph{width:140px;height:105px;object-fit:cover;border-radius:var(--r);background:#E8EDF1;border:1px solid var(--line);display:grid;place-items:center;color:#9AAAB6}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);padding:10px}
.chk label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--text)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:var(--r);z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:500}
.toast.err{background:var(--bad)}
.note{background:var(--warn-l);color:#7A5212;border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:14px}
footer.pg{color:var(--muted);font-size:12px;text-align:center;padding:20px}
#printArea{display:none}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff}
  body > *:not(#printArea){display:none !important}
  #printArea{display:block}
  #printArea *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:900px){
  .tiles,.det{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.kv,.grid{grid-template-columns:1fr 1fr}
  nav a{padding:0 8px}.sync{display:none}.bar input{min-width:0;flex:1}
  .hide-m{display:none}
}
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="brand" onclick="go('')">
    <div class="mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18V6h6l3 6h5v6"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/><path d="M21 4v14h-2"/></svg></div>
    <div>Evidence MTH<small>Vozíky · Baterie · Nabíječky</small></div>
  </div>
  <nav>
    <a href="#" data-r="">Přehled</a>
    <a href="#voziky" data-r="voziky">Vozíky</a>
    <a href="#baterie" data-r="baterie">Baterie</a>
    <a href="#nabijecky" data-r="nabijecky">Nabíječky</a>
  </nav>
  <div class="sp"></div>
  <div class="sync" id="sync">Načítám…</div>
  <button class="btn sm" style="background:transparent;border-color:#42B0D5" onclick="backupMenu()">💾 Záloha</button>
</div></div>
<main id="app"></main>
<footer class="pg">Evidence manipulační techniky · verze 2 · data jsou uložena v tomto prohlížeči – pravidelně zálohujte (tlačítko 💾 Záloha)</footer>
<div id="modal"></div>
<div id="printArea"></div>

<script>
/* ===================== Stav a data ===================== */
const S = { voziky:[], baterie:[], loadedV:false, loadedB:false, canWrite:true, db:null, assets:null, downloads:null, offline:false };
const DRUHY = ["Čelní vysokozdvižný vozík (VZV)","Retrak (výsuvný)","Elektrický paletový vozík","Ruční paletový vozík","Vychystávací vozík","Elektrický tahač","Plošinový vozík","Jiný"];
const POHON = ["Elektro","Diesel","LPG","Ruční"];
const STAV_V = ["V provozu","V opravě","Odstaven","Vyřazen"];
const TYP_B = ["Olověná trakční","Gelová","Li-Ion","LiFePO4","Jiná"];
const STAV_B = ["V provozu","Nabíjení","Rezerva","V servisu","Vyřazena"];
const REV_V = ["Technická kontrola","Revize","Servis","Oprava","Školení / jiné"];
const REV_B = ["Revize","Kontrola elektrolytu","Údržba","Kapacitní test","Výměna článku","Jiné"];
const TYP_N = ["Standardní (50 Hz)","Vysokofrekvenční (HF)","Pro Li-Ion","Jiná"];
const STAV_N = ["V provozu","Rezerva","V servisu","Vyřazena"];
const REV_N = ["Revize","Kontrola","Údržba","Oprava","Jiné"];
const VYSL = ["Vyhovuje","Vyhovuje s výhradami","Nevyhovuje"];
const VLASTNIK = ["Maersk","Jungheinrich","Servis Černý"];
const SERVIS = ["Servis Černý","Jungheinrich"];
const VYROBCI = ["Jungheinrich","Still","Toyota"];
const MODELY = ["ETV214","ETV216","ERE120","ERE125","ERE125 Li-Ion","ERE220","EFG220","ESE20","ESE120","ESE220","ERC12"];
// výběr ze seznamu; dříve zadaná hodnota mimo seznam se zachová
const selKeep = (n,l,arr,val) => sel(n,l,(val && !arr.includes(val)) ? [...arr,val] : arr, val, "", "— vyberte —");
const VYROBCI_BN = ["Jungheinrich","IBG","EnerSys"];
// pole s nabídkou: výběr ze seznamu + možnost napsat nového výrobce; dříve zadaní výrobci se nabízejí také
function vyrobceField(val){
  const used = [...S.baterie, ...S.nabijecky].map(x=>(x.vyrobce||"").trim()).filter(Boolean);
  const all = [...new Set([...VYROBCI_BN, ...used])].sort((a,b)=>a.localeCompare(b,"cs"));
  return `<label class="f">Výrobce<input name="vyrobce" list="vyrobceList" value="${esc(val||"")}" placeholder="vyberte nebo napište nového" autocomplete="off"></label>
    <datalist id="vyrobceList">${all.map(v=>`<option value="${esc(v)}">`).join("")}</datalist>`;
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const today = () => new Date().toISOString().slice(0,10);
const fmtD = d => { if(!d) return "—"; const [y,m,dd]=d.split("-"); return `${+dd}. ${+m}. ${y}`; };
const addMonths = (d,n) => { if(!d) return ""; const x=new Date(d+"T12:00:00"); x.setMonth(x.getMonth()+(+n||12)); return x.toISOString().slice(0,10); };
const daysTo = d => d ? Math.round((new Date(d+"T12:00:00") - new Date(today()+"T12:00:00"))/864e5) : null;
function dueBadge(d){
  if(!d) return '<span class="badge b-mut">Nezadáno</span>';
  const n = daysTo(d);
  if(n<0) return `<span class="badge b-bad">Prošlá ${fmtD(d)}</span>`;
  if(n<=30) return `<span class="badge b-warn">${fmtD(d)} · za ${n} d</span>`;
  return `<span class="badge b-ok">${fmtD(d)}</span>`;
}
function dueState(d){ if(!d) return "none"; const n=daysTo(d); return n<0?"bad":n<=30?"warn":"ok"; }
function stavBadge(s){
  const m = {"V provozu":"b-ok","Nabíjení":"b-blue","Rezerva":"b-mut","V opravě":"b-warn","V servisu":"b-warn","Odstaven":"b-mut","Vyřazen":"b-bad","Vyřazena":"b-bad"};
  return `<span class="badge ${m[s]||"b-mut"}">${esc(s||"—")}</span>`;
}
const photoSrc = o => o && o.foto ? (o.foto.url || (o.foto.assetId ? "/_blob/"+o.foto.assetId : o.foto.dataUrl) || "") : "";
const batsOf = vid => S.baterie.filter(b => b.vozikId === vid);
const vozikById = id => S.voziky.find(v => v.id === id);
const batById = id => S.baterie.find(b => b.id === id);
const nabById = id => S.nabijecky.find(n => n.id === id);
const nabsOf = vid => S.nabijecky.filter(n => n.vozikId === vid);
const byId = (col,id) => col==="voziky"?vozikById(id):col==="baterie"?batById(id):nabById(id);
const icoNab = (c="#42B0D5",s=30) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v5M15 2v5"/><path d="M6 7h12v4a6 6 0 0 1-12 0z"/><path d="M12 17v5"/></svg>`;
const icoTruck = (c="#42B0D5",s=30) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18V6h6l3 6h5v6"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/><path d="M21 4v14h-2"/></svg>`;
const icoBat = (c="#42B0D5",s=30) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="18" height="11" rx="2"/><path d="M22 11v3"/><path d="M10 9.5l-2 3.5h4l-2 3.5"/></svg>`;

function toast(msg, err){ const t=document.createElement("div"); t.className="toast"+(err?" err":""); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 3200); }

/* ===================== Lokální úložiště (IndexedDB v prohlížeči) ===================== */
S.downloads = true;
const DBNAME = "evidence-mth", DBVER = 2;
S.nabijecky = [];
let IDB = null;
function setSync(t){ document.getElementById("sync").textContent=t; }
function openIDB(){
  return new Promise((res,rej)=>{
    const rq = indexedDB.open(DBNAME, DBVER);
    rq.onupgradeneeded = () => { const d=rq.result; ["voziky","baterie","nabijecky"].forEach(n=>{ if(!d.objectStoreNames.contains(n)) d.createObjectStore(n,{keyPath:"id"}); }); };
    rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
  });
}
const idbAll = col => new Promise((res,rej)=>{ const r=IDB.transaction(col).objectStore(col).getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); });
const idbTx = (col, fn) => new Promise((res,rej)=>{ const t=IDB.transaction(col,"readwrite"); fn(t.objectStore(col)); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); });
async function reload(){ S.voziky = await idbAll("voziky"); S.baterie = await idbAll("baterie"); S.nabijecky = await idbAll("nabijecky"); render(); }
function stamp(){ try{ localStorage.setItem("mth-lastChange", new Date().toISOString()); }catch(e){} updateBackupInfo(); }
function updateBackupInfo(){
  let lb=null; try{ lb=localStorage.getItem("mth-lastBackup"); }catch(e){}
  setSync(lb ? "Poslední záloha: "+new Date(lb).toLocaleDateString("cs-CZ") : "Záloha zatím nebyla provedena");
}

(async function init(){
  try{
    IDB = await openIDB();
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
    await reload();
  }catch(e){ S.canWrite=false; S.offline=true; toast("Prohlížeč nepovolil ukládání dat.", true); }
  S.loadedV = S.loadedB = true; updateBackupInfo(); render();
})();

async function save(col, obj){
  if(!IDB) throw new Error("Úložiště není dostupné");
  const data = JSON.parse(JSON.stringify(obj));
  data.upraveno = new Date().toISOString();
  try{ await idbTx(col, s => s.put(data)); }
  catch(e){ throw new Error(e && e.name==="QuotaExceededError" ? "Úložiště prohlížeče je plné." : "Uložení se nepodařilo."); }
  const list = S[col]; const i=list.findIndex(x=>x.id===data.id);
  if(i>=0) list[i]=data; else list.push(data);
  stamp(); render();
}
async function remove(col,id){
  await idbTx(col, s => s.delete(id));
  S[col] = S[col].filter(x=>x.id!==id);
  stamp(); render();
}

/* ---------- soubory: stažení, záloha, obnova ---------- */
function downloadBlob(filename, blob){
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function backupMenu(){
  modal(`<div class="modal sm"><header><h3>Záloha dat</h3><button onclick="closeM()">×</button></header>
    <div class="body">
      <p style="margin-top:0">Data se ukládají <b>jen v tomto prohlížeči na tomto počítači</b>. Pravidelně si stáhněte zálohu. Ze zálohy můžete data obnovit nebo je přenést na jiný počítač.</p>
      <div style="display:flex;flex-direction:column;gap:10px">
        <button class="btn" onclick="doBackup()">⤓ Stáhnout zálohu (.json)</button>
        <label class="btn sec" style="justify-content:center">⤒ Načíst zálohu ze souboru<input type="file" accept=".json,application/json" style="display:none" onchange="doRestore(this)"></label>
      </div>
      <p class="sub" style="margin:14px 0 0;font-size:13px">Načtení zálohy <b>nahradí</b> všechna současná data v tomto prohlížeči.</p>
    </div></div>`);
}
function doBackup(){
  const data = { app:"evidence-mth", verze:2, vytvoreno:new Date().toISOString(), voziky:S.voziky, baterie:S.baterie, nabijecky:S.nabijecky };
  downloadBlob(`Zaloha_Evidence_MTH_${today()}.json`, new Blob([JSON.stringify(data)],{type:"application/json"}));
  try{ localStorage.setItem("mth-lastBackup", new Date().toISOString()); }catch(e){}
  updateBackupInfo(); closeM(); toast("Záloha stažena");
}
function doRestore(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload = () => {
    let d; try{ d=JSON.parse(r.result); }catch(e){ toast("Soubor není platná záloha.", true); return; }
    if(!d || !Array.isArray(d.voziky) || !Array.isArray(d.baterie)){ toast("Soubor není záloha Evidence MTH.", true); return; }
    confirmBox(`Načíst zálohu z ${d.vytvoreno?new Date(d.vytvoreno).toLocaleString("cs-CZ"):"souboru"}?<br><b>${d.voziky.length}</b> vozíků, <b>${d.baterie.length}</b> baterií a <b>${(d.nabijecky||[]).length}</b> nabíječek.<br><br>Současná data v tomto prohlížeči budou nahrazena.`, async ()=>{
      const clean = a => a.filter(x=>x && typeof x.id==="string");
      await idbTx("voziky", s => { s.clear(); clean(d.voziky).forEach(x=>s.put(x)); });
      await idbTx("baterie", s => { s.clear(); clean(d.baterie).forEach(x=>s.put(x)); });
      await idbTx("nabijecky", s => { s.clear(); clean(Array.isArray(d.nabijecky)?d.nabijecky:[]).forEach(x=>s.put(x)); });
      await reload(); toast("Záloha načtena");
    }, "Načíst");
  };
  r.readAsText(f);
}

/* ===================== Routing ===================== */
function go(h){ location.hash = h ? "#"+h : "#"; if(!h) render(); }
window.addEventListener("hashchange", ()=>{ render(); window.scrollTo(0,0); });
function route(){ return (location.hash||"").replace(/^#/,""); }

function render(){
  const r = route();
  document.querySelectorAll("nav a").forEach(a => {
    const k=a.dataset.r; a.classList.toggle("on", k===""? r==="" : (r===k || r.startsWith({voziky:"vozik-",baterie:"bat-",nabijecky:"nab-"}[k])));
  });
  const app = document.getElementById("app");
  const keepFocus = document.activeElement && document.activeElement.id;
  const caret = keepFocus && document.activeElement.selectionStart;
  if(!S.loadedV || !S.loadedB){ if(!S.offline){ app.innerHTML = `<div class="empty">Načítám evidenci…</div>`; return; } }
  if(r==="voziky") app.innerHTML = viewVoziky();
  else if(r==="baterie") app.innerHTML = viewBaterie();
  else if(r.startsWith("vozik-")) app.innerHTML = viewVozik(r.slice(6));
  else if(r.startsWith("bat-")) app.innerHTML = viewBat(r.slice(4));
  else if(r==="nabijecky") app.innerHTML = viewNabijecky();
  else if(r.startsWith("nab-")) app.innerHTML = viewNab(r.slice(4));
  else app.innerHTML = viewHome();
  if(keepFocus){ const el=document.getElementById(keepFocus); if(el && el.tagName==="INPUT"){ el.focus(); try{el.setSelectionRange(caret,caret);}catch(e){} } }
}

function nextNum(col,prefix){
  const list = S[col];
  let max=0; list.forEach(x=>{ const m=String(x.cislo||"").match(/(\d+)\s*$/); if(m) max=Math.max(max,+m[1]); });
  return prefix + String(max+1).padStart(3,"0");
}
function pickFoto(input){
  const f = input.files && input.files[0]; if(!f) return;
  const img = new Image(); const url = URL.createObjectURL(f);
  img.onload = () => {
    let w=img.width,h=img.height,M=1280; if(w>M||h>M){ const k=M/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
    const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
    const dataUrl = c.toDataURL("image/jpeg",0.82);
    c.toBlob(blob => { pendingFoto = {dataUrl, blob, w, h, img}; }, "image/jpeg", 0.82);
    document.getElementById("fprev").innerHTML = `<img src="${dataUrl}">`;
    URL.revokeObjectURL(url);
  };
  img.onerror = () => toast("Soubor se nepodařilo načíst jako obrázek.", true);
  img.src = url;
}
function smallDataUrl(p){ // záložní uložení fotky přímo do záznamu (max ~150 kB)
  let M=800, q=0.75, out;
  for(let i=0;i<6;i++){ const k=Math.min(1,M/Math.max(p.w,p.h)); const c=document.createElement("canvas"); c.width=Math.round(p.w*k); c.height=Math.round(p.h*k);
    const im=new Image(); im.src=p.dataUrl; c.getContext("2d").drawImage(p.img||im,0,0,c.width,c.height); out=c.toDataURL("image/jpeg",q); if(out.length<150000) break; M*=0.8; q-=0.07; }
  return out;
}
async function saveVozik(form, id){
  const btn = document.getElementById("svbtn"); btn.disabled=true; btn.textContent="Ukládám…";
  try{
    const d = formData(form);
    if(S.voziky.some(v=>v.id!==id && (v.cislo||"").toLowerCase()===d.cislo.toLowerCase())) throw new Error("Vozík s tímto evidenčním číslem už existuje.");
    const old = id ? vozikById(id) : {};
    const obj = { ...old, ...d, id: id || uid("v") };
    if(!id) obj.revize = [];
    if(pendingFoto==="remove") obj.foto=null;
    else if(pendingFoto && pendingFoto.dataUrl){
      obj.foto = { dataUrl: smallDataUrl(pendingFoto) };
    }
    await save("voziky", obj);
    // přidělení baterií
    const chosen = [...form.querySelectorAll('input[name=bat]:checked')].map(x=>x.value);
    for(const b of S.baterie){
      const should = chosen.includes(b.id), is = b.vozikId===obj.id;
      if(should && !is) await save("baterie", {...b, vozikId:obj.id, datumNasazeni: b.datumNasazeni||today()});
      else if(!should && is) await save("baterie", {...b, vozikId:""});
    }
    const chosenN = [...form.querySelectorAll('input[name=nab]:checked')].map(x=>x.value);
    for(const n of [...S.nabijecky]){
      const should = chosenN.includes(n.id), is = n.vozikId===obj.id;
      if(should && !is) await save("nabijecky", {...n, vozikId:obj.id, datumNasazeni: n.datumNasazeni||today()});
      else if(!should && is) await save("nabijecky", {...n, vozikId:""});
    }
    closeM(); toast("Vozík uložen"); if(!id) go("vozik-"+obj.id);
  }catch(e){ toast(e.message||"Chyba při ukládání", true); btn.disabled=false; btn.textContent="Uložit vozík"; }
}

async function saveBat(form,id){

    const old = id ? batById(id) : {revize:[]};

}

async function saveRev(form,col,id){
  const btn=document.getElementById("svbtn"); btn.disabled=true;
  try{
    const d = formData(form); const isV = col==="voziky";
    const o = byId(col,id);
    const obj = {...o, revize:[...(o.revize||[]), {id:uid("r"),...d}]};
    if(isV && d.typ==="Technická kontrola"){ if(!o.tkDatum || d.datum>=o.tkDatum){ obj.tkDatum=d.datum; if(d.pristi) obj.tkPristi=d.pristi; } }
    if(!isV && d.typ==="Revize"){ if(!o.revizeDatum || d.datum>=o.revizeDatum){ obj.revizeDatum=d.datum; if(d.pristi) obj.revizePristi=d.pristi; } }
    await save(col,obj); closeM(); toast("Záznam přidán");
  }catch(e){ toast(e.message,true); btn.disabled=false; }
}
function confirmBox(text, ok, label="Smazat"){
  modal(`<div class="modal sm"><header><h3>Potvrzení</h3><button onclick="closeM()">×</button></header>
    <div class="body">${text}</div>
    <footer><button class="btn sec" onclick="closeM()">Zrušit</button><button class="btn danger" id="cfok">${label}</button></footer></div>`);
  document.getElementById("cfok").onclick = async ()=>{ try{ await ok(); closeM(); }catch(e){ toast("Akce se nepodařila", true); } };
}
function delRev(col,id,rid){
  confirmBox("Opravdu smazat tento záznam z historie?", async ()=>{ const o = byId(col,id); await save(col,{...o, revize:(o.revize||[]).filter(r=>r.id!==rid)}); toast("Záznam smazán"); });
}

function delBat(id){

  const nRows = nsAll.map(n=>({"Ev. číslo":n.cislo,"Druh":n.typ||"","Výrobce":n.vyrobce||"","Model":n.model||"","Výrobní číslo":n.vyrobniCislo||"","Rok výroby":num(n.rokVyroby),"Výstupní napětí (V)":num(n.napeti),"Proud (A)":num(n.proud),"Umístění":n.umisteni||"","Vlastník":n.vlastnik||"","Opravy provádí":n.servis||"","Stav":n.stav||"","Vozík":(vozikById(n.vozikId)||{}).cislo||"","Nasazena od":dt(n.datumNasazeni),"Poslední revize":dt(n.revizeDatum),"Příští revize":dt(n.revizePristi),"Stav revize":({bad:"PROŠLÁ",warn:"Do 30 dnů",ok:"OK",none:"Nezadáno"})[dueState(n.revizePristi)],"Poznámka":n.poznamka||""}));
  const rRows = [];

  vs.forEach(v=>(v.revize||[]).forEach(r=>rRows.push({"Objekt":"Vozík","Ev. číslo":v.cislo,"Datum":dt(r.datum),"Úkon":r.typ,"Provedl":r.provedl||"","Výsledek":r.vysledek||"","Příští termín":dt(r.pristi),"Poznámka":r.poznamka||""})));

  add(vRows,"Vozíky",["Ev. číslo","Druh","Výrobce","Model","Výrobní číslo","Rok výroby","Nosnost (kg)","Pohon","Umístění","Odpovědná osoba","Vlastník","Opravy provádí","Stav","Baterie","Poslední TK","Příští TK","Stav TK","Popis"]);
  add(bRows,"Baterie",["Ev. číslo","Typ","Výrobce","Výrobní číslo","Rok výroby","Napětí (V)","Kapacita (Ah)","Hmotnost (kg)","Vlastník","Opravy provádí","Stav","Vozík","Nasazena od","Poslední revize","Příští revize","Stav revize","Poznámka"]);
  add(nRows,"Nabíječky",["Ev. číslo","Druh","Výrobce","Model","Výrobní číslo","Rok výroby","Výstupní napětí (V)","Proud (A)","Umístění","Vlastník","Opravy provádí","Stav","Vozík","Nasazena od","Poslední revize","Příští revize","Stav revize","Poznámka"]);
  add(rRows,"Revize a kontroly",["Objekt","Ev. číslo","Datum","Úkon","Provedl","Výsledek","Příští termín","Poznámka"]);
  const buf = XLSX.write(wb,{type:"array",bookType:"xlsx",cellDates:true});
  downloadBlob(`Evidence_MTH_${today()}.xlsx`, new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  toast("Excel stažen");
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeM(); });
